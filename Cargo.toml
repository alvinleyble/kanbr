[package]
name = "kanbr"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A Kanban board for Firstmate work inside Herdr"
repository = "https://github.com/alvinleyble/kanbr"
readme = "README.md"
keywords = ["kanban", "tui", "herdr", "firstmate"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
